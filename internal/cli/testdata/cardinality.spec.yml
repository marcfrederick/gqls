schema: |-
  CREATE PROPERTY GRAPH someGraphType {
    (:Person { id :: INTEGER }),
    (:Address { id :: INTEGER }),
    (:Person)-(1,1)-[:LIVES_AT]-(0,*)->(:Address)
  }

cases:
  - name: One person, no address
    query: "CREATE (p:Person { id: 1 })"
    want_err: true
  - name: One person, one address
    query: |-
      CREATE (p:Person { id: 2 }), (a:Address { id: 2 }),
             (p)-[:LIVES_AT]->(a);
  - name: One person, two addresses
    query: |-
      CREATE (p:Person { id: 3 }), (a1:Address { id: 3 }), (a2:Address { id: 4 }),
             (p)-[:LIVES_AT]->(a1), (p)-[:LIVES_AT]->(a2);
    want_err: true
