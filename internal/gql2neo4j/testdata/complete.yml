input: |-
  CREATE PROPERTY GRAPH someGraphType {
    (p:Person { name :: STRING, age :: INT8 }),
    (:Person)~[:is_friend { since :: DATE NOT NULL, nickname :: VARCHAR(32) }]~(:Person),
    (:Person)-[:likes { since :: DATE NOT NULL }]->(:Post)
  }
want: |-
  CREATE CONSTRAINT constraint_person_name_type FOR (n:Person) REQUIRE n.name IS :: STRING;
  CREATE CONSTRAINT constraint_person_age_type FOR (n:Person) REQUIRE n.age IS :: INTEGER;
  CALL apoc.trigger.add("constraint_person_age_trigger", "UNWIND $createdNodes AS e WITH e WHERE e:Person AND e.age IS NOT NULL AND (e.age < -128 OR e.age > 127) CALL apoc.util.validate(true, 'age must be between -128 and 127', [])", {phase: "before"});
  CREATE CONSTRAINT constraint_is_friend_since_type FOR (n:is_friend) REQUIRE n.since IS :: DATE;
  CREATE CONSTRAINT constraint_is_friend_since_existence FOR (n:is_friend) REQUIRE n.since IS NOT NULL;
  CREATE CONSTRAINT constraint_is_friend_nickname_type FOR (n:is_friend) REQUIRE n.nickname IS :: STRING;
  CALL apoc.trigger.add("constraint_is_friend_nickname_trigger", "UNWIND $createdRelationships AS e WITH e WHERE e:is_friend AND e.nickname IS NOT NULL AND (size(e.nickname) < 0 OR size(e.nickname) > 32) CALL apoc.util.validate(true, 'nickname must be between 0 and 32 characters', [])", {phase: "before"});
  CREATE CONSTRAINT constraint_likes_since_type FOR (n:likes) REQUIRE n.since IS :: DATE;
  CREATE CONSTRAINT constraint_likes_since_existence FOR (n:likes) REQUIRE n.since IS NOT NULL;
