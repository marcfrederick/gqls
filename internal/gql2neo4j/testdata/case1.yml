input: |-
  CREATE PROPERTY GRAPH TYPE someGraphType {
    (:Person { name :: STRING NOT NULL, age :: INT8 })
  }
want: |-
  CREATE CONSTRAINT constraint_person_name_type FOR (n:Person) REQUIRE n.name IS :: STRING;
  CREATE CONSTRAINT constraint_person_name_existence FOR (n:Person) REQUIRE n.name IS NOT NULL;
  CREATE CONSTRAINT constraint_person_age_type FOR (n:Person) REQUIRE n.age IS :: INTEGER;
  CALL apoc.trigger.add("constraint_person_age_trigger", "UNWIND $createdNodes AS node WITH node WHERE node:Person AND node.age IS NOT NULL AND (node.age < -128 OR node.age > 127) CALL apoc.util.validate(true, 'age must be between -128 and 127', [])", {phase: "before"});
