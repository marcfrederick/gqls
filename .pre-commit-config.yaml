repos:
  - repo: local
    hooks:
      - id: generate
        name: Generate
        entry: mise run generate
        language: system
        files: ^internal/gql/grammar/.*\.g4$
        pass_filenames: false
      - id: test
        name: Test
        entry: mise run test
        language: system
        pass_filenames: false
      - id: lint
        name: Lint
        entry: mise run lint
        language: system
        pass_filenames: false
