[tools]
pre-commit = "latest"

[tasks.clean]
description = "Remove binary"
run = "rm -rf ./gqls"

[tasks.generate]
description = "Run go generate"
run = "mkdir -p internal/gql/grammar && go generate ./..."

[tasks.build]
description = "Build the application"
depends = ["generate"]
run = "go build -o gqls ./cmd/cli/main.go"

[tasks.lint]
# go-check-sumtype is included in golangci-lint, but doesn't work properly,
# so we run it separately
description = "Run linters"
run = "golangci-lint run ./... && go tool go-check-sumtype $(go list ./... | grep -v vendor)"

[tasks.test]
description = "Run tests"
depends = ["generate"]
run = "go test ./..."
